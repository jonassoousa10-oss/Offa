name: Arena Rush 3D (APK de teste)
on:
  push:
    branches: [arena-rush-demo-2026]
    paths:
      - 'arena-rush/**'
      - '.github/workflows/arena-rush-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android preinstalado
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-disabled: true
      - name: Compilar APK Android Debug
        working-directory: arena-rush
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Disponibilizar APK (retencao minima)
        uses: actions/upload-artifact@v4
        with:
          name: ArenaRush3D-v0.1-apk
          path: arena-rush/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
