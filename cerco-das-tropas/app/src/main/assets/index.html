function newSoldier(team,x,z,hero=false){const collection=team?red:blue;if(collection.length>=MAX-1)return;collection.push({x:x+random(-.17,.17),z:z+random(-.08,.08),y:0,phase:random(0,6.28),hero,mask:0,power:hero?5:1,health:hero?5:1});}
function popup(message){$('toast').textContent=message;$('toast').classList.add('show');toastTime=performance.now()+1200;}
function playFx(type){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!window.ctx)window.ctx=new C();const ctx=window.ctx;if(ctx.state==='suspended')ctx.resume();let t=ctx.currentTime,o=ctx.createOscillator(),gain=ctx.createGain();o.type=type===0?'sine':type===1?'triangle':'sawtooth';o.frequency.setValueAtTime(type===0?360:type===1?640:115,t);o.frequency.exponentialRampToValueAtTime(type===0?135:type===1?920:45,t+.15);gain.gain.setValueAtTime(type===0?.034:type===1?.07:.09,t);gain.gain.exponentialRampToValueAtTime(.001,t+.17);o.connect(gain);gain.connect(ctx.destination);o.start(t);o.stop(t+.19);}catch(e){}}
function confetti(){for(let i=0;i<36;i++)blast(random(-4,4),random(-25,-40),[0x31f9fc,0xffc82a,0xff5685][i%3],4);}
function win(){if(mode!=='playing')return;mode='won';touching=false;coins+=80+(stage+1)*60;gems+=2;try{localStorage.setItem('cerco_coins',coins);}catch(e){}playFx(1);confetti();setTimeout(()=>showDialog('VITÓRIA! 🏆','Castelo conquistado! +'+(80+(stage+1)*60)+' moedas • +2 gemas','PRÓXIMA FASE ▶'),400);}
function lose(){if(mode!=='playing')return;mode='lost';touching=false;playFx(2);setTimeout(()=>showDialog('BASE INVADIDA!','As tropas vermelhas alcançaram o canhão. Multiplique os soldados pelos portais para resistir.','TENTAR NOVAMENTE ↻'),450);}
function showDialog(title,subtitle,button){$('title').innerHTML=title;$('subtitle').textContent=subtitle;$('play').textContent=button;$('badge').textContent='FASE '+(stage+1)+' • '+palettes[stage].name;$('modal').style.display='flex';}
function start(){if(mode==='won'){stage=(stage+1)%5;try{localStorage.setItem('cerco_stage',stage);}catch(e){}makeLevel();}else if(mode==='lost'){makeLevel();}mode='playing';$('modal').style.display='none';popup('DERROTE A FORTALEZA!');touching=false;}
$('play').addEventListener('pointerdown',ev=>{ev.stopPropagation();});$('play').addEventListener('click',start);
$('heroBtn').addEventListener('pointerdown',e=>e.stopPropagation());$('heroBtn').addEventListener('click',ev=>{ev.stopPropagation();if(mode==='playing'&&heroEnergy>=100){newSoldier(0,aim,10,true);heroEnergy=0;playFx(1);popup('CAMPEÃO NA BATALHA!');}});
function touchAim(clientX){aim=Math.max(-3.7,Math.min(3.7,((clientX/innerWidth)-.5)*10));if(cannon)cannon.position.x=aim;}
renderer.domElement.addEventListener('pointerdown',e=>{if(mode==='playing'){touchAim(e.clientX);touching=true;renderer.domElement.setPointerCapture(e.pointerId);if(window.ctx)window.ctx.resume();}});
renderer.domElement.addEventListener('pointermove',e=>{if(mode==='playing'&&touching)touchAim(e.clientX);});window.addEventListener('pointerup',()=>touching=false);window.addEventListener('pointercancel',()=>touching=false);
function update(dt,now){runTime+=dt;spawnClock-=dt;enemyClock-=dt;if(touching&&spawnClock<=0){spawnClock=.12-(stage*.006);newSoldier(0,aim,10.5);heroEnergy=Math.min(100,heroEnergy+1.2);shots++;if(shots%3===0)playFx(0);}
if(enemyClock<=0){enemyClock=Math.max(.6,1.7-stage*.15);for(let i=0;i<1+Math.floor(stage/2);i++)newSoldier(1,random(-3.3,3.3),-34.7);}
// Gate movement begins at stage 4, matching the visible collision volumes.
for(let g of stageGate){if(stage>=3){g.x=g.baseX+Math.sin(runTime*(stage===4?.8:.55)+g.z*.1)*.45;g.g.position.x=g.x;}}
const born=[];
for(let i=blue.length-1;i>=0;i--){let u=blue[i],old=u.z;u.z-=dt*(u.hero?6.9:8.4);u.phase+=dt*.18;
for(let k=0;k<stageGate.length;k++){let g=stageGate[k];if(!(u.mask&(1<<k))&&old>g.z&&u.z<=g.z){u.mask|=(1<<k);if(Math.abs(u.x-g.x)<1.3){let extras=g.mult-1;for(let j=0;j<extras;j++)if(blue.length+born.length<MAX-1)born.push({x:Math.max(-4,Math.min(4,u.x+random(-.58,.58))),z:u.z+random(-.38,.38),y:0,phase:random(0,6.28),hero:false,mask:u.mask,power:1,health:1});if(born.length) {heroEnergy=Math.min(100,heroEnergy+2);if(Math.random()<.2)playFx(1);}}}}
if(u.z<-37.2){hp-=u.power;blue.splice(i,1);blast(u.x,-37,0xffdc67,3);if(hp<=0){win();break;}}
}
if(mode!=='playing')return;blue.push(...born);
for(let i=red.length-1;i>=0;i--){let u=red[i];u.z+=dt*(2.65+stage*.24);if(u.z>=10.4){red.splice(i,1);blast(u.x,14,0xff486d,8);lose();break;}}
for(let i=blue.length-1;i>=0;i--){let u=blue[i],hit=-1;for(let j=red.length-1;j>=0;j--){let e=red[j],dx=u.x-e.x,dz=u.z-e.z;if(dx*dx+dz*dz<(u.hero?1.55:.50)){hit=j;break;}}if(hit>=0){const e=red[hit];red.splice(hit,1);u.health-=1;if(u.health<=0)blue.splice(i,1);blast(u.x,u.z,0xffc953,u.hero?8:3);if(Math.random()<.12)playFx(2);}}
}
function updateVisuals(dt,now){if(mode==='playing')update(dt,now);renderMobs(0,blue,runTime);renderMobs(1,red,runTime+1);
if(cannon){cannon.position.x=aim;cannon.rotation.y=Math.sin(runTime*3)*.01;}
for(let i=particle.length-1;i>=0;i--){let p=particle[i];p.life-=dt;p.mesh.position.x+=p.vx*dt;p.mesh.position.y+=p.vy*dt;p.mesh.position.z+=p.vz*dt;p.vy-=15*dt;p.mesh.scale.multiplyScalar(1-dt*.35);if(p.life<=0||p.mesh.position.y<0){scene.remove(p.mesh);particle.splice(i,1);}}
if(mode==='playing'&&now-lastUpdateHUD>150){$('blue').textContent=blue.length;$('red').textContent=red.length;$('coins').textContent=coins;$('gems').textContent=gems;$('stagefill').style.width=Math.max(0,(1-hp/maxHp)*100)+'%';const btn=$('heroBtn');btn.disabled=heroEnergy<100;btn.querySelector('small').textContent=heroEnergy<100?'CARGA '+Math.floor(heroEnergy)+'%':'CONVOCAR';lastUpdateHUD=now;}
if(toastTime&&now>toastTime){$('toast').classList.remove('show');toastTime=0;}
}
function frame(now){const dt=Math.min(.036,(now-last)/1000);last=now;try{updateVisuals(dt,now);renderer.render(scene,camera);}catch(err){console.error('game frame',err);}$('fps').textContent='FPS '+Math.round(1/Math.max(dt,.01));requestAnimationFrame(frame);}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.35));});
makeLevel();showDialog('CERCO DAS<br>TROPAS','Um jogo 3D de multidões, portais multiplicadores, combates e conquista de castelos. Cinco fases com cenários diferentes.','JOGAR AGORA ▶');requestAnimationFrame(frame);
})();
</script></body></html>
